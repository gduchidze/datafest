# Scoring scheme: quality +3/-4, policy +3/-5, latency +2/-2, budget +2/-2,
# async +2/-1, cache locality penalty, +1 recommended. Escalation +2/-2 is added.
[scoring]
quality_ok = 3
quality_bad = -4
policy_ok = 3
policy_bad = -5
latency_ok = 2
latency_bad = -2
budget_ok = 2
budget_bad = -2
async_ok = 2
async_bad = -1
escalation_ok = 2
escalation_bad = -2
cache_penalty_low = 3
cache_penalty_medium = 1
recommended_bonus = 1
monthly_pages = 100000

[synthetic]
base_variant = "03_decision_model"
split_variant = "05_split_workflow"
latency_saving_s = 0.30
latency_floor_s = 0.5
sync_background_cost_usd = 0.00007

[architecture.baseline_one_big_agent]
label = "One big agent"
variant = "00_bad_baseline"
models = "gpt-6.1-terra for every step"
tools = "all tools exposed"
cache = "none"
workflow = "all work synchronous"
best_for = "prototype smell test only"

[architecture.controlled_terra]
label = "Controlled terra agent"
variant = "01_prompt_tool_context_controls"
models = "gpt-6.1-terra for review"
tools = "allowed tools by page type"
cache = "none"
workflow = "some follow-up still synchronous"
best_for = "high-risk launch while routing is unproven"

[architecture.llm_routed]
label = "LLM routed luna/terra"
variant = "02_model_routing"
models = "gpt-6-luna triage and routine pages, gpt-6.1-terra for high risk"
tools = "allowed tools by routed path"
cache = "none"
workflow = "some follow-up still synchronous"
best_for = "mixed matters with moderate repeat traffic"

[architecture.decisions_code_router]
label = "Decisions + code router"
variant = "03a_router_only"
models = "Decisions on gpt-6-luna, code router, luna redaction"
tools = "code pre-lookup, no model tools"
cache = "none"
workflow = "some follow-up still synchronous"
best_for = "typed routing at volume when thresholds are calibrated"

[architecture.decisions_llm_cascade]
label = "Decisions + LLM cascade"
variant = "03_decision_model"
models = "Decisions on gpt-6-luna, gpt-6.1-terra second opinion in the ambiguous band"
tools = "code pre-lookup, no model tools"
cache = "none"
workflow = "some follow-up still synchronous"
best_for = "matters where attorney time costs more than a terra call"

[architecture.decisions_cache]
label = "Decisions + cache"
variant = "04_prompt_caching"
models = "Decisions on gpt-6-luna, terra second opinion, luna redaction"
tools = "code pre-lookup, no model tools"
cache = "stable protocol prefix"
workflow = "some follow-up still synchronous"
best_for = "rolling productions that reuse one protocol"

[architecture.decisions_split_no_cache]
label = "Decisions split, no cache"
variant = ""
models = "Decisions on gpt-6-luna, terra second opinion, luna Batch background"
tools = "code pre-lookup, no model tools"
cache = "none"
workflow = "page path sync, privilege log, QA and tags async"
best_for = "low-repeat matters that still need async follow-up work"

[architecture.balanced_split]
label = "Balanced split workflow"
variant = "05_split_workflow"
models = "Decisions on gpt-6-luna, terra second opinion, luna Batch background"
tools = "code pre-lookup, no model tools"
cache = "stable protocol prefix"
workflow = "page path sync, privilege log, QA and tags async"
best_for = "mature repeated-protocol review programs"

[[scenarios]]
scenario = "Second-request deadline"
description = "Huge volume, a court deadline, and cost per page matters most."
quality_floor = 0.90
policy_floor = 0.90
p50_latency_target_s = 2.0
monthly_budget_100k_pages_usd = 100
max_escalation_rate = 0.40
needs_async = true
cache_locality = "high"
recommended = ["balanced_split", "decisions_cache"]

[[scenarios]]
scenario = "Privilege-heavy custodians"
description = "Counsel's own mailboxes: privilege misses are unacceptable."
quality_floor = 0.90
policy_floor = 1.0
p50_latency_target_s = 3.0
monthly_budget_100k_pages_usd = 200
max_escalation_rate = 0.60
needs_async = true
cache_locality = "medium"
recommended = ["decisions_llm_cascade", "controlled_terra"]

[[scenarios]]
scenario = "PII/HIPAA-heavy matter"
description = "Health and account data everywhere: a PII leak is the failure to avoid."
quality_floor = 0.90
policy_floor = 1.0
p50_latency_target_s = 3.0
monthly_budget_100k_pages_usd = 150
max_escalation_rate = 0.50
needs_async = true
cache_locality = "medium"
recommended = ["decisions_split_no_cache", "decisions_llm_cascade"]

[[scenarios]]
scenario = "Small internal investigation"
description = "A few thousand pages, quality over unit cost, little repetition."
quality_floor = 0.90
policy_floor = 0.95
p50_latency_target_s = 4.0
monthly_budget_100k_pages_usd = 400
max_escalation_rate = 0.70
needs_async = false
cache_locality = "low"
recommended = ["controlled_terra", "llm_routed"]

[[scenarios]]
scenario = "Rolling production, repeated protocol"
description = "Weekly productions under one protocol: the prefix repeats constantly."
quality_floor = 0.90
policy_floor = 0.95
p50_latency_target_s = 2.0
monthly_budget_100k_pages_usd = 80
max_escalation_rate = 0.45
needs_async = true
cache_locality = "high"
recommended = ["balanced_split", "decisions_cache"]

[[scenarios]]
scenario = "Low-repeat long tail of matters"
description = "Many small matters, each with its own protocol: cache hits are rare."
quality_floor = 0.90
policy_floor = 0.95
p50_latency_target_s = 2.5
monthly_budget_100k_pages_usd = 120
max_escalation_rate = 0.50
needs_async = true
cache_locality = "low"
recommended = ["decisions_split_no_cache", "llm_routed"]

