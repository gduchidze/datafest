[project]
name = "doc-review-opt"
version = "0.1.0"
description = "Optimizing a document-review agent for cost and quality: Decisions API vs LLM."
requires-python = ">=3.13"
dependencies = [
    "openai==3.55.0",
    "langgraph==1.2.22",
    "langsmith==0.15.0",
    "pydantic==2.14.3",
    "httpx2==2.16.2",
    "pandas==3.1.1",
    "matplotlib==3.11.2",
    "jinja2==3.1.6",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pip-audit==2.10.1",
    "pandas-stubs==3.1.0.261029",
    "pyright[nodejs]==1.1.414",
]
notebook = [
    "ipykernel==7.4.0",
    "jupyterlab==4.6.6",
    "nbclient==0.11.0",
    "nbconvert==7.17.2",
    "nbformat==5.11.1",
    "python-dotenv==1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
extend-exclude = ["notebooks"]
lint.select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "ASYNC", "PT", "PERF", "TRY", "C90", "ERA"]
lint.ignore = ["TRY003"]
lint.mccabe.max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --cov --cov-branch --cov-report=term-missing --cov-fail-under=97"

[tool.coverage.run]
source = ["src"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"
